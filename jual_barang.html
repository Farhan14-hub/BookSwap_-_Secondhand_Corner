
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website UKRI</title>
    <link rel="stylesheet" href="./css/style_jual_barang.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="./img/images.jpg" alt="logo ukri" width="100px" height="100px">
        </div>

        <ul class="menu">
            <li><a href="beranda.html">Beranda</a></li>
            <li><a href="jual_barang.html" class="active">Jual Barang</a></li>
            <li><a href="tukar_barang.html">Tukar Barang</a></li>
            <li><a href="katalog_buku.html">Katalog Buku</a></li>
            <li><a href="riwayat_transaksi.html">Riwayat Transaksi</a></li>
            <li><a href="Profil.html">Profil</a></li>
        </ul>
    </nav>

    <!-- CONTEN JUAL BARANG -->
<script src="./js/script_jual_barang.js"></script>

<section class="hero">
    <div class="hero-text">
        <h1>Jual Barang</h1>
        <p>
            Cari serta unggah buku dan barang bekas anda untuk dijual, ditukar, dan dibeli disini.
        </p>
    </div>
</section> 

<section class="tabel">

      <form id="formBarang">
        <div class="isi">

          <!-- kolom kiri -->
          <div class="isi-dalam-tabel">
            <label for="jenis">Jenis</label>
            <select id="jenis" name="jenis">
              <option value="buku">Buku</option>
              <option value="barang">Barang Bekas</option>
            </select>
          </div>

          <!-- Kolom kanan -->
          <div class="isi-dalam-tabel">
            <label for="judul">Judul / nama barang</label>
            <input type="text" id="judul" name="judul">
          </div>

          <!-- kolom kiri -->
          <div class="isi-dalam-tabel">
            <label for="penulis">Penulis / merek</label>
            <input type="text" id="penulis" name="penulis">
          </div>

          <!-- kolom kanan -->
          <div class="isi-dalam-tabel">
            <label for="kategori">Kategori</label>
            <select id="kategori" name="kategori">
              <option>Fiksi</option>
              <option>Bisnis</option>
              <option>Sains & Teknologi</option>
              <option>Anak</option>
              <option>Lainnya</option>
            </select>
          </div>

          <!-- kolom kiri -->
          <div class="isi-dalam-tabel">
            <label for="kondisi">Kondisi</label>
            <select id="kondisi" name="kondisi">
              <option>Baru</option>
              <option>Bagus</option>
              <option>Cukup</option>
            </select>
          </div>

          <div class="isi-dalam-tabel">
            <label for="tipe">Tipe</label>
            <select id="tipe" name="tipe">
              <option value="jual">jual</option>
              <option value="tukar">tukar</option>
              <option value="tukar">beli</option>
            </select>
          </div>

          <div class="isi-dalam-tabel">
            <label for="harga">Harga (Rp)</label>
            <input type="number" id="harga" name="harga" value="0" min="0">
          </div>

          <div class="isi-dalam-tabel">
            <label for="foto">Foto (maks 300 KB)</label>
            <input type="file" id="foto" name="foto" accept="image/*">
          </div>

        </div>

        <!-- Deskripsi (lebar penuh) -->
        <div class="isi-dalam-tabel">
          <label for="deskripsi">Deskripsi</label>
          <textarea id="deskripsi" name="deskripsi" rows="2"></textarea>
        </div>

        <button type="submit" class="btn">Simpan</button>

      </form>
    </section>
  </main>

</body>
</html>
